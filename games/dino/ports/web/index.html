<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino · rea-games</title>
<meta name="description" content="Jump and duck to avoid obstacles in the verified Dino rebuild.">
<meta property="og:title" content="Dino · rea-games">
<meta property="og:description" content="Jump and duck to avoid obstacles in the verified Dino rebuild.">
<meta property="og:image" content="https://erkamyaman.github.io/rea-games/assets/social-preview.png">
<style>
  :root { --bg:#eef0f3; --card:#fff; --text:#22262e; --muted:#6b7385; --accent:#ff7a45; --sky:#f7f7f7; --ink:#535353; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --card:#20242e; --text:#e8eaf0; --muted:#8b93a7; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 system-ui,sans-serif; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  main { width:min(100% - 24px, 760px); padding:16px 0; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:12px; }
  h1 { margin:0; font-size:30px; letter-spacing:-.5px; }
  header span { color:var(--muted); font-size:13px; text-align:right; }
  #stage { position:relative; background:var(--card); border-radius:14px; padding:10px; box-shadow:0 6px 24px rgba(0,0,0,.14); }
  #wrap { position:relative; border-radius:8px; overflow:hidden; cursor:pointer; touch-action:none; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:600/150; }
  #duck { margin-top:10px; width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff;
          font:inherit; font-weight:700; letter-spacing:.04em; display:none; touch-action:none; }
  @media (pointer: coarse) { #duck { display:block; } }
  #duck:active { filter:brightness(.88); }
  p.keys { margin:12px 2px 0; color:var(--muted); font-size:14px; }
  kbd { background:var(--bg); border-radius:5px; padding:1px 7px; font:inherit; font-weight:600; color:var(--text); }
  nav.site { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; font-size:14px; }
  nav.site a { color:var(--muted); text-decoration:none; padding:4px 0; border-radius:4px; }
  nav.site a:hover { color:var(--text); text-decoration:underline; }
  nav.site a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; color:var(--text); }
  nav.site a.repo { font-size:13px; }
</style>
</head>
<body>
<main>
  <nav class="site" aria-label="rea-games"><a href="../index.html">&larr; All games</a><a class="repo" href="https://github.com/erkamyaman/rea-games">rea-games on GitHub</a></nav>
  <header><h1>Dino</h1><span>own art · rules rebuilt from the recording</span></header>
  <div id="stage">
    <div id="wrap"><canvas id="c" width="600" height="150" role="img" aria-label="Dino game"></canvas></div>
    <button id="duck" type="button">HOLD TO DUCK</button>
  </div>
  <p class="keys"><kbd>Space</kbd> / <kbd>&uarr;</kbd> or tap: jump (hold for a higher jump) &middot; <kbd>&darr;</kbd>: duck, or drop faster in the air &middot; after a crash: <kbd>Space</kbd> / tap / <kbd>Enter</kbd> to run again.</p>
</main>
<script type="module">
import { Dino } from "./dino.mjs";

(function main() {
  const STEP = 1000 / 60;      // the rules are stepped at 60 Hz whatever the screen does
  const INTRO_MS = 400;        // length of the intro animation, as in the recording
  const W = 600, H = 150, GROUND = 127;
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const rootStyle = getComputedStyle(document.documentElement);

  // ---- canvas size: crisp on high density screens
  function fit() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const cssW = cv.getBoundingClientRect().width || W;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssW * dpr * H / W);
    ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0);
  }
  window.addEventListener("resize", fit);
  fit();

  // ---- game
  let best = 0;
  try { best = Number(localStorage.getItem("rea-dino-best")) || 0; } catch (e) { /* private mode */ }
  // DEMO HOOK (scripts/demo-dino.mjs): when window.__tape is set, the game draws its random numbers from that
  // recorded tape, the driver steps it with the case's dt, and window.__rea exposes snapshot(). Without it
  // nothing below changes.
  const TAPE = Array.isArray(window.__tape) ? window.__tape : null;
  let tapeUsed = 0;
  const rng = TAPE ? () => { if (tapeUsed >= TAPE.length) throw new Error("tape used up"); return TAPE[tapeUsed++]; } : Math.random;
  const game = new Dino({ rng, clock0: TAPE ? 1000 : performance.now() });
  let introT = 0, queue = [], acc = 0, last = null, ticks = 0, crashTicks = 0;
  const clouds = [{ x: 380, y: 40 }, { x: 120, y: 62 }];
  let scoreOf = () => { const d = Math.ceil(game.distanceRan); return d ? Math.round(d * 0.025) : 0; };

  // ---- input
  const push = (k) => queue.push(k);
  addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); push({ jump: true }); }
    else if (e.code === "ArrowDown") { e.preventDefault(); push({ duck: true }); }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); push({ jumpUp: true }); }
    else if (e.code === "ArrowDown") { e.preventDefault(); push({ duckUp: true }); }
    else if (e.code === "Enter") push({ enter: true });
  });
  const wrap = document.getElementById("wrap");
  wrap.addEventListener("pointerdown", (e) => { e.preventDefault(); push({ jump: true }); });
  const lift = () => push({ jumpUp: true });
  wrap.addEventListener("pointerup", lift);
  wrap.addEventListener("pointercancel", lift);
  const duckBtn = document.getElementById("duck");
  duckBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); push({ duck: true }); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) duckBtn.addEventListener(t, () => push({ duckUp: true }));
  addEventListener("blur", () => { push({ jumpUp: true }); push({ duckUp: true }); });

  // ---- simulation
  function tick(dt = STEP) {
    const inp = queue.length ? queue.shift() : {};
    inp.dt = dt;
    if (game.playingIntro) { introT += dt; if (introT >= INTRO_MS) { inp.animEnd = true; introT = 0; } } else introT = 0;
    const wasCrashed = game.crashed;
    game.step(inp);
    ticks++;
    crashTicks = game.crashed ? crashTicks + 1 : 0;
    if (!wasCrashed && game.crashed) {
      const s = scoreOf();
      if (s > best) { best = s; try { localStorage.setItem("rea-dino-best", String(best)); } catch (e) { /* ignore */ } }
    }
    // drifting clouds (looks only)
    const v = game.activated && !game.crashed ? game.currentSpeed * 0.2 : 0;
    for (const c of clouds) { c.x -= v * 0.6; if (c.x < -50) { c.x = W + Math.random() * 200; c.y = 25 + Math.random() * 45; } }
  }

  // ---- drawing (all shapes are rectangles drawn here, nothing is loaded)
  const pal = (night) => night
    ? { sky: "#202124", ink: "#e8e8e8", dim: "#6b6e75", eye: "#202124" }
    : { sky: "#f7f7f7", ink: "#535353", dim: "#c8c8c8", eye: "#f7f7f7" };
  function rects(list, ox, oy, color) { ctx.fillStyle = color; for (const [x, y, w, h] of list) ctx.fillRect(ox + x, oy + y, w, h); }

  function drawDino(g, p) {
    const t = g.tRex, ox = t.xPos, oy = t.yPos;
    const dead = g.crashed;
    const leg = !t.jumping && g.activated && !dead && Math.floor(ticks / 5) % 2 === 0;
    if (t.ducking && !dead) {
      rects([[1, 28, 40, 15], [34, 20, 22, 14], [48, 22, 9, 4], [0, 30, 6, 6], [8, 41, 5, 4], [26, 41, 5, 4]], ox, oy, p.ink);
      rects([[48, 23, 3, 3]], ox, oy, p.eye);
      if (!leg) rects([[8, 43, 5, 2]], ox, oy, p.ink);
      return;
    }
    rects([
      [22, 0, 17, 15], [30, 13, 9, 4],        // head and jaw
      [10, 14, 20, 20],                       // chest
      [4, 22, 8, 10], [0, 26, 6, 6],          // tail
      [26, 24, 8, 3],                         // little arm
      [12, 33, 12, 3],
    ], ox, oy, p.ink);
    // legs: one forward, one back, swap while running
    const a = leg ? 36 : 42, b = leg ? 42 : 36;
    rects([[12, 34, 5, a - 34 + 5], [20, 34, 5, b - 34 + 5]], ox, oy, p.ink);
    rects([[12, 40 + (a === 42 ? 3 : 0), 8, 3]], ox, oy, p.ink);
    if (dead) { rects([[31, 3, 2, 2], [35, 3, 2, 2], [33, 5, 2, 2], [31, 7, 2, 2], [35, 7, 2, 2]], ox, oy, p.eye); }
    else rects([[32, 3, 4, 4]], ox, oy, p.eye);
    rects([[34, 14, 4, 2]], ox, oy, p.eye); // mouth
  }

  function drawCactus(o, p) {
    const small = o.typeConfig.type === "CACTUS_SMALL";
    const uw = o.typeConfig.width, h = o.typeConfig.height;
    for (let i = 0; i < o.size; i++) {
      const x = o.xPos + i * uw, y = o.yPos;
      const stem = small ? 6 : 8, sx = x + Math.round((uw - stem) / 2);
      const arm = small ? [[x, y + 12, 4, 10, 3], [x + uw - 4, y + 6, 4, 12, 3]] : [[x + 1, y + 20, 5, 14, 5], [x + uw - 6, y + 12, 5, 16, 5]];
      ctx.fillStyle = p.ink;
      ctx.fillRect(sx, y, stem, h);
      ctx.fillRect(sx + 1, y - 1, stem - 2, 1);
      for (const [ax, ay, aw, ah, reach] of arm) {
        ctx.fillRect(ax, ay + ah - 4, aw + reach, 4);                       // elbow joined to the stem
        ctx.fillRect(ax, ay, aw, ah);                                       // arm going up
      }
      ctx.fillStyle = p.dim;
      ctx.fillRect(sx + 2, y + 4, 1, h - 10);
    }
  }

  function drawPtero(o, p) {
    const x = o.xPos, y = o.yPos, up = Math.floor(ticks / 9) % 2 === 0;
    rects([[0, 16, 14, 4], [4, 14, 6, 3], [12, 14, 26, 12], [36, 17, 10, 5]], x, y, p.ink);
    if (up) rects([[16, 3, 6, 11], [20, 0, 10, 6]], x, y, p.ink);
    else rects([[16, 26, 6, 10], [20, 33, 10, 6]], x, y, p.ink);
    rects([[8, 15, 2, 2]], x, y, p.eye);
  }

  function drawGround(g, p) {
    ctx.fillStyle = p.ink; ctx.fillRect(0, GROUND, W, 1);
    const scroll = Math.floor(g.distanceRan * 0.9) % 4096;
    ctx.fillStyle = p.dim;
    for (let i = -2; i < W / 9 + 2; i++) {
      const k = Math.floor((i * 9 + scroll) / 9);
      const h = (k * 2654435761 >>> 0) % 7;
      const x = i * 9 - (scroll % 9);
      if (h === 0) ctx.fillRect(x, GROUND + 5, 6, 1);
      else if (h === 1) ctx.fillRect(x, GROUND + 9, 3, 1);
      else if (h === 2) ctx.fillRect(x, GROUND + 3, 2, 2);
    }
  }

  function digits(n, len) { return String(n).padStart(len, "0"); }

  function draw() {
    const night = Math.floor(scoreOf() / 700) % 2 === 1;
    const p = pal(night);
    cv.style.background = p.sky;
    ctx.fillStyle = p.sky; ctx.fillRect(0, 0, W, H);
    // moon and clouds
    if (night) { ctx.fillStyle = p.ink; ctx.beginPath(); ctx.arc(520, 38, 11, 0, 7); ctx.fill(); ctx.fillStyle = p.sky; ctx.beginPath(); ctx.arc(526, 35, 10, 0, 7); ctx.fill(); }
    ctx.fillStyle = p.dim;
    for (const c of clouds) { ctx.fillRect(c.x + 6, c.y, 30, 4); ctx.fillRect(c.x, c.y + 4, 46, 5); ctx.fillRect(c.x + 12, c.y - 4, 14, 4); }
    drawGround(game, p);
    for (const o of game.obstacles) { if (o.typeConfig.type === "PTERODACTYL") drawPtero(o, p); else drawCactus(o, p); }
    drawDino(game, p);
    // score
    ctx.font = "bold 13px ui-monospace, Menlo, Consolas, monospace";
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillStyle = p.ink; ctx.fillText(digits(scoreOf(), 5), W - 10, 8);
    ctx.fillStyle = p.dim; ctx.fillText("HI " + digits(best, 5), W - 70, 8);
    ctx.textAlign = "center";
    if (!game.activated && !game.playing) { ctx.fillStyle = p.ink; ctx.font = "bold 14px system-ui, sans-serif"; ctx.fillText("PRESS SPACE OR TAP TO START", W / 2, 58); }
    if (game.crashed) {
      ctx.fillStyle = p.ink; ctx.font = "bold 17px ui-monospace, Menlo, Consolas, monospace";
      ctx.fillText("G A M E   O V E R", W / 2, 38);
      // restart arrow
      ctx.strokeStyle = p.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(W / 2, 80, 11, 0.5, 5.5); ctx.stroke();
      ctx.fillStyle = p.ink; ctx.beginPath(); ctx.moveTo(W / 2 + 14, 70); ctx.lineTo(W / 2 + 4, 69); ctx.lineTo(W / 2 + 12, 80); ctx.fill();
      if (crashTicks * STEP >= 750) { ctx.fillStyle = p.dim; ctx.font = "12px system-ui, sans-serif"; ctx.fillText("space / tap / enter", W / 2, 104); }
    }
  }

  // ---- frame loop
  function frame(ts) {
    if (last === null) last = ts;
    acc += Math.min(ts - last, 100);
    last = ts;
    if (!TAPE) while (acc >= STEP) { tick(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }
  if (TAPE) window.__rea = {
    // one frame of the recorded case: the key events dispatched since the last call are merged into one input
    step(dt) { const inp = Object.assign({}, ...queue); queue = []; queue.push(inp); tick(dt); draw(); return game.snapshot(); },
    snapshot: () => game.snapshot(),
    tapeUsed: () => tapeUsed,
  };
  document.addEventListener("visibilitychange", () => { last = null; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
