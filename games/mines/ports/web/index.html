<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mines</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1b202b;
      --border: #2c3446;
      --text: #e6ebf5;
      --muted: #8f9bb3;
      --accent: #4f8cff;
      --accent-hover: #6aa0ff;
      --danger: #ef5350;
      --win: #4caf50;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
      user-select: none;
    }
    .shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      max-width: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hud {
      display: flex;
      gap: 16px;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .hud strong { color: var(--text); }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      background: #262e3f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #313b52; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    .start-screen {
      width: 780px;
      max-width: 100%;
      height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #151923;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      padding: 24px;
    }
    .start-screen p {
      margin: 0;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.5;
    }
    .diff-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .diff-row button {
      min-width: 110px;
      padding: 10px 18px;
    }
    canvas {
      display: block;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0f131a;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }
    .hidden { display: none; }.sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .status-bar {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .status-text {
      font-weight: 700;
      color: var(--text);
    }
    .status-text.won { color: var(--win); }
    .status-text.lost { color: var(--danger); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <h1>Mines</h1>
      <div class="hud">
        <span>Mines: <strong id="hud-mines">0</strong></span>
        <span>Flags: <strong id="hud-flags">0</strong></span>
        <span>Time: <strong id="hud-time">0s</strong></span>
      </div>
      <div class="controls">
        <button id="btn-reset" class="hidden">Reset</button>
        <button id="btn-menu" class="hidden">Difficulty</button>
      </div>
    </div>

    <div id="start-screen" class="start-screen">
      <h2>Choose Difficulty</h2>
      <p>Left-click to reveal a tile. Right-click a hidden tile to place or remove a flag. Right-click a revealed number to chord its neighbors. Flag every mine to win.</p>
      <div class="diff-row">
        <button class="primary" data-diff="easy">Easy</button>
        <button class="primary" data-diff="medium">Medium</button>
        <button class="primary" data-diff="insane">Insane</button>
      </div>
    </div>

    <canvas id="board" width="780" height="520" class="hidden" role="img" aria-label="Mines board"></canvas>

    <p id="live" class="sr-only" aria-live="polite" aria-atomic="true"></p><div class="status-bar">
      <span id="status-text" class="status-text">Game on :)</span>
      <span>30 &times; 20 Grid</span>
    </div>
  </div>

  <script type="module">
import { COLS, ROWS, createState, step, snapshot } from "./mines.mjs";

    const CELL = 26;
    const NUM_COLORS = {
      1: "#64b5f6",
      2: "#81c784",
      3: "#e57373",
      4: "#9575cd",
      5: "#ffb74d",
      6: "#4dd0e1",
      7: "#f06292",
      8: "#cfd8dc",
    };

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("start-screen");
    const btnReset = document.getElementById("btn-reset");
    const btnMenu = document.getElementById("btn-menu");
    const hudMines = document.getElementById("hud-mines");
    const hudFlags = document.getElementById("hud-flags");
    const hudTime = document.getElementById("hud-time");
    const statusText = document.getElementById("status-text"); const set = (id, v) => { const el = document.getElementById(id), s = String(v); if (el.textContent !== s) el.textContent = s; };

    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;

    const state = createState();

    function drawFlag(px, py) {
      ctx.strokeStyle = "#e6ebf5";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 9, py + 20);
      ctx.lineTo(px + 9, py + 6);
      ctx.stroke();

      ctx.fillStyle = "#ff5252";
      ctx.beginPath();
      ctx.moveTo(px + 10, py + 6);
      ctx.lineTo(px + 20, py + 10);
      ctx.lineTo(px + 10, py + 14);
      ctx.closePath();
      ctx.fill();
    }

    function drawMine(px, py) {
      const cx = px + CELL / 2;
      const cy = py + CELL / 2;
      ctx.strokeStyle = "#12151c";
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(a) * 8, cy - Math.sin(a) * 8);
        ctx.lineTo(cx + Math.cos(a) * 8, cy + Math.sin(a) * 8);
        ctx.stroke();
      }
      ctx.fillStyle = "#12151c";
      ctx.beginPath();
      ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx - 2, cy - 2, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    function render() {
      const snap = snapshot(state);
      const onStart = snap.screen === "start";

      startScreen.classList.toggle("hidden", !onStart);
      canvas.classList.toggle("hidden", onStart);
      btnReset.classList.toggle("hidden", onStart);
      btnMenu.classList.toggle("hidden", onStart);

      hudMines.textContent = String(snap.totalMines);
      hudFlags.textContent = String(snap.totalFlags);
      hudTime.textContent = `${snap.elapsedTime}s`;
      statusText.textContent = snap.status;
      statusText.classList.toggle("won", snap.status === "You won! :D");
      statusText.classList.toggle("lost", snap.status === "Game over :("); set("live", snap.status + ", " + snap.totalFlags + " flags");

      if (onStart) return;

      const lost = snap.gameover && snap.status === "Game over :(";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = "bold 15px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const px = x * CELL;
          const py = y * CELL;
          const isRev = snap.revealed[y][x] === "1";
          const isFlag = snap.flags[y][x] === "F";
          const mineVal = snap.mines[y][x];

          if (isRev) {
            ctx.fillStyle = mineVal === "*" ? "#ef5350" : "#181d27";
            ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
            if (mineVal === "*") {
              drawMine(px, py);
            } else if (mineVal !== "0" && mineVal !== ".") {
              ctx.fillStyle = NUM_COLORS[mineVal] || "#e6ebf5";
              ctx.fillText(mineVal, px + CELL / 2, py + CELL / 2 + 1);
            }
          } else {
            ctx.fillStyle = "#2b3447";
            ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
            ctx.fillStyle = "#364159";
            ctx.fillRect(px + 1, py + 1, CELL - 2, 2);
            if (lost && mineVal === "*") {
              ctx.fillStyle = "#4b2c32";
              ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
              drawMine(px, py);
            } else if (isFlag) {
              drawFlag(px, py);
            }
          }
        }
      }
    }

    document.querySelectorAll("[data-diff]").forEach((btn) => {
      btn.addEventListener("click", () => {
        step(state, { dt: 0, action: { type: "difficulty", value: btn.dataset.diff } }, Math.random);
        render();
      });
    });

    btnReset.addEventListener("click", () => {
      step(state, { dt: 0, action: { type: "reset" } }, Math.random);
      render();
    });

    btnMenu.addEventListener("click", () => {
      step(state, { dt: 0, action: { type: "switch" } }, Math.random);
      render();
    });

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("mouseup", (e) => {
      if (e.button !== 0 && e.button !== 2) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) * canvas.width) / rect.width / CELL);
      const y = Math.floor(((e.clientY - rect.top) * canvas.height) / rect.height / CELL);
      const button = e.button === 2 ? "right" : "left";
      step(state, { dt: 0, action: { type: "click", button, x, y } }, Math.random);
      render();
    });

    setInterval(() => {
      if (state.difficulty !== 0 && !state.firstClick && !state.gameover) {
        step(state, { dt: 100, action: null }, Math.random);
        render();
      }
    }, 100);

    render();
  </script>
</body>
</html>
